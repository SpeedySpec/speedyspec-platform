[package]
name = "speedyspec-wp-text-diff"
version = "0.3.0"
description = "WordPress's wp_text_diff(): a port of Horde's native diff engine and WordPress's table renderer, with SIMD string work."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "diff", "text", "simd"]
categories = ["text-processing"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "text-diff"
role = "implementation"

[dependencies]
foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
memchr = "2.8"
simdutf8 = "0.1.5"
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.2.0" }
speedyspec-wp-text-diff-contracts = { path = "../speedyspec-wp-text-diff-contracts", version = "0.3.0" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = "1"

[[bench]]
name = "text_diff"
harness = false
