[package]
name = "speedyspec-wp-utf8"
version = "0.6.0"
description = "WordPress's UTF-8 helpers (utf8.php, compat-utf8.php) as of WordPress 7.1.5: scanning, validation, scrubbing and code point counting over bytes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "utf-8", "unicode", "validation"]
categories = ["encoding", "text-processing"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "text"
role = "implementation"

[dependencies]
simdutf8 = "0.1.5"
