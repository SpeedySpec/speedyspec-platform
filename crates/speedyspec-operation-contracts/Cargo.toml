[package]
name = "speedyspec-operation-contracts"
version = "0.1.0"
description = "The unified operation API's contracts: the neutral value, schemas, types, operations, errors, the caller and the ports. Depends on no SpeedySpec crate."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "operations", "schema", "api", "contracts"]
categories = ["web-programming", "api-bindings"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "operation"
role = "contracts"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
thiserror = "2"
