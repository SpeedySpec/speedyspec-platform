[package]
name = "speedyspec-data"
version = "0.3.0"
description = "Data-access contracts for speedyspec: values, statements, SQL/NoSQL/Direct stores, engines and the unit of work. No implementations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "database", "sql", "unit-of-work", "contracts"]
categories = ["database"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "data"
role = "contracts"

[dependencies]
sqlparser = { version = "0.64", features = ["visitor"] }
