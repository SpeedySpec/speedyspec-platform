[package]
name = "speedyspec-wp-kses-contracts"
version = "0.5.0"
description = "WordPress's kses sanitizer as contracts: the allowlist types and the ports any kses implementation fills."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "kses", "sanitizer", "html"]
categories = ["web-programming", "text-processing"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "html"
role = "contracts"

[dependencies]
indexmap = "2"
