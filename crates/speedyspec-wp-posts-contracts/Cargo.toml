[package]
name = "speedyspec-wp-posts-contracts"
version = "0.3.1"
description = "WordPress's post contracts: the post entity and its values, post type and status names and values, the errors and the ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "posts", "post-types", "contracts"]
categories = ["web-programming", "database"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "query"
role = "contracts"

[dependencies]
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts", version = "0.2.0" }
speedyspec-wp-object-cache-contracts = { path = "../speedyspec-wp-object-cache-contracts", version = "0.2.0" }
speedyspec-php-serialize = { path = "../speedyspec-php-serialize", version = "0.3.0" }

[features]
conformance = []
