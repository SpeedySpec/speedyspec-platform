[package]
name = "speedyspec-wp-crypto-contracts"
version = "0.5.0"
description = "Contracts for WordPress's sodium functions: the hash, signature, encoding, clock, translation and filter ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "sodium", "crypto", "contracts"]
categories = ["web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "password"
role = "contracts"

[dependencies]
