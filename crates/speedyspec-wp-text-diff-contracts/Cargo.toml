[package]
name = "speedyspec-wp-text-diff-contracts"
version = "0.3.0"
description = "Contracts for WordPress's text diff: edit operations, table options, and the differ and line filter ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "diff", "text", "contracts"]
categories = ["text-processing"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "text-diff"
role = "contracts"

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.2.0" }
