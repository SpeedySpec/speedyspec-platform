[package]
name = "speedyspec-wp-token-map"
version = "0.5.0"
description = "WordPress's WP_Token_Map in Rust, in WordPress's own layout, and the HTML5 named character references as a compile-time table."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "html5", "entities", "token-map"]
categories = ["text-processing", "parser-implementations"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "html"
role = "implementation"

[dependencies]
memchr = "2"

[dev-dependencies]
serde_json = "1"
