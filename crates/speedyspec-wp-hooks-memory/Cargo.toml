[package]
name = "speedyspec-wp-hooks-memory"
version = "0.2.0"
description = "The in-memory hook store, with worker-lifetime and request-lifetime partitions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "hooks", "in-memory", "filters"]
categories = ["web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "hooks"
role = "adapter"

[dependencies]
indexmap = "2"
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks", version = "0.2.0" }
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts", version = "0.2.0" }

[dev-dependencies]
serde_json = "1"
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-cqrs = { path = "../speedyspec-cqrs" }
