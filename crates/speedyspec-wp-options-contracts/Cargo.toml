[package]
name = "speedyspec-wp-options-contracts"
version = "0.1.0"
description = "WordPress's options API contracts: the option API other seams call, its errors and the typed reader."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "options", "settings", "contracts"]
categories = ["web-programming", "database"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "options"
role = "contracts"

[dependencies]
speedyspec-data = { path = "../speedyspec-data", version = "0.3.0" }
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts", version = "0.2.0" }
speedyspec-wp-object-cache-contracts = { path = "../speedyspec-wp-object-cache-contracts", version = "0.2.0" }
