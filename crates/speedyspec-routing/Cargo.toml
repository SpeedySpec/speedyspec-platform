[package]
name = "speedyspec-routing"
version = "0.2.0"
description = "Routing contracts: routes, resolutions, route data, the table store, dispatch strategies and WordPress's routing concepts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "routing", "router", "wordpress", "contracts"]
categories = ["web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "http"
role = "implementation"

[dependencies]
speedyspec-http = { path = "../speedyspec-http", version = "0.2.0" }
