[package]
name = "speedyspec-wp-hooks-php"
version = "0.2.2"
description = "WordPress's hook functions, WP_Hook and the hook globals in PHP, native over the Rust Hook API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "hooks", "php", "ffi"]
categories = ["development-tools::ffi", "web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
# docs.rs's ext-php-rs bindings have no embed symbols, so the docs are built without the `embed` feature.
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "hooks"
role = "php"

[features]
default = ["embed"]
# The embedded PHP. Off only for docs.rs, which cannot build it (see speedyspec-php).
embed = ["speedyspec-php/embed", "speedyspec-php-ext/embed"]

[dependencies]
speedyspec-container = { path = "../speedyspec-container", version = "0.2.0" }
speedyspec-cqrs = { path = "../speedyspec-cqrs", version = "0.2.0" }
speedyspec-php = { path = "../speedyspec-php", version = "0.8.1", default-features = false }
speedyspec-php-ext = { path = "../speedyspec-php-ext", version = "0.2.1", default-features = false }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks", version = "0.2.0" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory", version = "0.2.0" }
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts", version = "0.2.0" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
speedyspec-compat = { path = "../speedyspec-compat" }
speedyspec-container-php = { path = "../speedyspec-container-php" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "php_store"
harness = false

[[test]]
name = "wordpress"
harness = false

[[test]]
name = "without_legacy"
harness = false
