[package]
name = "speedyspec-php-port-macros"
version = "0.2.0"
description = "#[php_port]: generates a Rust port trait's PHP twin interface and its PHP adapter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "php", "proc-macro", "ports", "ffi"]
categories = ["development-tools::ffi"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
