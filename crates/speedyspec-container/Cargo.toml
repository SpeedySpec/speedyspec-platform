[package]
name = "speedyspec-container"
version = "0.1.4"
description = "A service container with the functionality of Laravel's: bindings, singletons, scoped instances, aliases, extenders, contextual bindings, tags and resolving callbacks, with worker and request lifetimes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "container", "dependency-injection", "ioc", "services"]
categories = ["web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[dependencies]
thiserror = "2"
