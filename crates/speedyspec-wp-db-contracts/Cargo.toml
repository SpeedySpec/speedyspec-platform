[package]
name = "speedyspec-wp-db-contracts"
version = "0.1.0"
description = "The wpdb port (wpdb, as other seams call it), its values and its errors."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "wpdb", "database", "contracts"]
categories = ["database", "web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "database"
role = "contracts"

[dependencies]
speedyspec-data = { path = "../speedyspec-data", version = "0.2.0" }
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.4" }
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts", version = "0.1.0" }
