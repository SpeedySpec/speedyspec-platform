[package]
name = "speedyspec-wp-kses-lexical"
version = "0.5.0"
description = "kses.php's pure string functions (entities, protocols, attribute parsing) over fast byte matchers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "kses", "html", "sanitizer"]
categories = ["text-processing", "parser-implementations"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "html"
role = "implementation"

[dependencies]
indexmap = "2"
memchr = "2"
speedyspec-wp-html-syntax = { path = "../speedyspec-wp-html-syntax", version = "0.5.0" }
speedyspec-wp-kses-contracts = { path = "../speedyspec-wp-kses-contracts", version = "0.5.0" }
