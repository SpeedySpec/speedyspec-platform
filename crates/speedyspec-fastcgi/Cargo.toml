[package]
name = "speedyspec-fastcgi"
version = "0.1.4"
description = "FastCGI 1.0: records and name-value pairs, a blocking responder (the PHP worker's side) and an async client (the server's side), streaming in both directions with backpressure."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "fastcgi", "fcgi", "php-fpm", "protocol"]
categories = ["network-programming", "web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[dependencies]
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
