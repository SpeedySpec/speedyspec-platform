[package]
name = "speedyspec-cqrs"
version = "0.1.4"
description = "Command and query buses: handlers resolved from the service container by key, middleware, and direct dispatch."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "cqrs", "command-bus", "query-bus", "middleware"]
categories = ["web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[dependencies]
speedyspec-container = { path = "../speedyspec-container", version = "0.1.4" }
thiserror = "2"

[dev-dependencies]
trybuild = "1"
