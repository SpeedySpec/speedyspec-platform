[package]
name = "speedyspec-http"
version = "0.1.0"
description = "Contracts for HTTP messages, factories, handlers and middleware, shaped after PSR-7, PSR-17, PSR-15 and PSR-18."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "http", "psr-7", "middleware", "contracts"]
categories = ["web-programming", "network-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "http"
role = "contracts"

[dependencies]
