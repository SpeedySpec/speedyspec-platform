[package]
name = "speedyspec-wp-shortcode-contracts"
version = "0.5.0"
description = "WordPress's Shortcode API contracts: the plain types, the ports and strategies, and WordPress's pattern strings."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "shortcode", "parser", "contracts"]
categories = ["web-programming", "text-processing"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "shortcode"
role = "contracts"

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.4" }
