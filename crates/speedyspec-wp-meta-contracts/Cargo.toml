[package]
name = "speedyspec-wp-meta-contracts"
version = "0.4.0"
description = "WordPress's metadata API contracts: the meta values, the entity and its errors."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "metadata", "meta", "contracts"]
categories = ["web-programming", "database"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "meta"
role = "contracts"

[dependencies]
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts", version = "0.2.0" }
speedyspec-wp-object-cache-contracts = { path = "../speedyspec-wp-object-cache-contracts", version = "0.2.0" }
speedyspec-php-serialize = { path = "../speedyspec-php-serialize", version = "0.3.0" }

[features]
conformance = []
