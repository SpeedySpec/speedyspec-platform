[package]
name = "speedyspec-native-stage"
version = "0.2.0"
description = "The contract for answering a request in Rust before PHP runs: stages, their outcome and a chain of them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "http", "middleware", "request", "contracts"]
categories = ["web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "http"
role = "contracts"

[dependencies]
