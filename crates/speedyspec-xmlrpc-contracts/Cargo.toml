[package]
name = "speedyspec-xmlrpc-contracts"
version = "0.1.0"
description = "The XML-RPC transport's contracts: the binding, method calls and responses, faults, and the mapping, fault, hooks and login ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "xml-rpc", "api", "contracts"]
categories = ["web-programming", "api-bindings"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "xmlrpc"
role = "contracts"

[dependencies]
speedyspec-operation-contracts = { path = "../speedyspec-operation-contracts", version = "0.1.0" }
