[package]
name = "speedyspec-hooks-memory"
version = "0.1.4"
description = "In-memory backend for the speedyspec hook contract."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "hooks", "events", "in-memory", "plugins"]
categories = ["web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "hooks"
role = "adapter"

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.4" }

[dev-dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", features = ["conformance"] }
