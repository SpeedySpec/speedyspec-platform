[package]
name = "speedyspec-abilities-contracts"
version = "0.1.0"
description = "The Abilities transport's contracts: the ability binding and annotations, and the mapping, hooks and steps ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "abilities", "contracts", "api"]
categories = ["web-programming", "api-bindings"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "ability"
role = "contracts"

[dependencies]
speedyspec-operation-contracts = { path = "../speedyspec-operation-contracts", version = "0.1.0" }
