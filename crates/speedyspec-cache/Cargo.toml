[package]
name = "speedyspec-cache"
version = "0.3.0"
description = "The Caching Store contract: byte values in groups, with expiry. No implementations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "cache", "contracts", "key-value", "expiry"]
categories = ["caching"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "cache"
role = "contracts"

[dependencies]
