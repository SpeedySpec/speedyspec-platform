[package]
name = "speedyspec-wp-object-cache-contracts"
version = "0.2.0"
description = "The object cache port (wp_cache_*, as other seams call it) and its errors."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "object-cache", "cache", "contracts"]
categories = ["caching", "web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "object-cache"
role = "contracts"

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.2.0" }
