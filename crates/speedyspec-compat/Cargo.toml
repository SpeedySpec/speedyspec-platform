[package]
name = "speedyspec-compat"
version = "0.9.0"
description = "Recorded compatibility: run a catalogue of scenarios against WordPress's original code, record the results, and replay them against the Rust ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "php", "compatibility", "testing"]
categories = ["development-tools::ffi", "web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.4" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory", version = "0.1.4" }
speedyspec-php = { path = "../speedyspec-php", version = "0.7.0" }
tar = "0.4"
tempfile = "3"
ureq = "3"
