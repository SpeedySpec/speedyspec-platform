[package]
name = "speedyspec-rest-contracts"
version = "0.1.0"
description = "The REST transport's contracts: bindings, the REST request and response, links, and the RestHooks port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "rest", "api", "contracts"]
categories = ["web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "rest-api"
role = "contracts"

[dependencies]
indexmap = "2"
speedyspec-operation-contracts = { path = "../speedyspec-operation-contracts", version = "0.1.0" }
