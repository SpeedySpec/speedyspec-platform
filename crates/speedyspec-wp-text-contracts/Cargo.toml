[package]
name = "speedyspec-wp-text-contracts"
version = "0.5.0"
description = "The ports WordPress's formatting functions read outside facts through (site settings, translations, locale, diagnostics), apart from any implementation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "formatting", "text", "contracts"]
categories = ["text-processing", "web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "text"
role = "contracts"

[dependencies]
