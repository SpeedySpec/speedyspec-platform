[package]
name = "speedyspec-wp-hooks"
version = "0.1.4"
description = "WordPress's Hook API (plugin.php and WP_Hook) as commands and queries over a hook store port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "hooks", "filters", "actions"]
categories = ["web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "hooks"
role = "implementation"

[dependencies]
indexmap = "2"
speedyspec-container = { path = "../speedyspec-container", version = "0.1.4" }
speedyspec-cqrs = { path = "../speedyspec-cqrs", version = "0.1.4" }
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.4" }
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts", version = "0.1.0" }

[dev-dependencies]
# The README example runs over the in-memory store.
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
