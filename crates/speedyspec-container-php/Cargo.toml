[package]
name = "speedyspec-container-php"
version = "0.1.6"
description = "The service container from PHP: SpeedySpec\\Container\\Container, PHP bindings as request-long overrides of Rust ports, and PHP autowiring."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "container", "php", "dependency-injection", "ffi"]
categories = ["development-tools::ffi", "web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
# docs.rs's ext-php-rs bindings have no embed symbols, so the docs are built without the `embed` feature.
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[features]
default = ["embed"]
# The embedded PHP. Off only for docs.rs, which cannot build it (see speedyspec-php).
embed = ["speedyspec-php/embed", "speedyspec-php-ext/embed"]

[dependencies]
speedyspec-container = { path = "../speedyspec-container", version = "0.1.4" }
speedyspec-php = { path = "../speedyspec-php", version = "0.7.0", default-features = false }
speedyspec-php-ext = { path = "../speedyspec-php-ext", version = "0.1.6", default-features = false }
thiserror = "2"

[dev-dependencies]
speedyspec-php-port-macros = { path = "../speedyspec-php-port-macros" }
speedyspec-port-macros = { path = "../speedyspec-port-macros" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "php"
harness = false
