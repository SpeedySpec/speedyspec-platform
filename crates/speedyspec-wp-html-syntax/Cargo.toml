[package]
name = "speedyspec-wp-html-syntax"
version = "0.5.0"
description = "WordPress's HTML API syntax pieces: WP_HTML_Decoder, the HTML5 named character references, start-tag attributes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "html", "entities", "attributes"]
categories = ["parser-implementations", "text-processing"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "html"
role = "implementation"

[dependencies]
memchr = "2"
speedyspec-wp-token-map = { path = "../speedyspec-wp-token-map", version = "0.5.0" }
