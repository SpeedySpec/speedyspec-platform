[package]
name = "speedyspec-wp-hooks-contracts"
version = "0.2.0"
description = "The Hook API port (plugin.php, as other seams call it) and the values passed through it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "wordpress", "hooks", "filters", "contracts"]
categories = ["web-programming"]
# The package ships the library only; the tests run in this repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "hooks"
role = "contracts"

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.2.0" }
