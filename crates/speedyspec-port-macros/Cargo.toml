[package]
name = "speedyspec-port-macros"
version = "0.1.0"
description = "#[port]: a port trait's key and its re-resolving container proxy, with no PHP; edge ports also carry their signature to php_twin!."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
speedyspec-container = { path = "../speedyspec-container" }
trybuild = "1"
