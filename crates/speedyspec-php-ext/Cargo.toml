[package]
name = "speedyspec-php-ext"
version = "0.1.6"
description = "The speedyspec_wordpress PHP extension's shared parts: PHP twins of Rust ports, their PHP adapters, value conversion and the boundary counter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "php", "extension", "wordpress", "ffi"]
categories = ["development-tools::ffi", "api-bindings"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.4" }
speedyspec-php = { path = "../speedyspec-php", version = "0.7.0" }
speedyspec-php-port-macros = { path = "../speedyspec-php-port-macros", version = "0.1.4" }
inventory = "0.3"

[dev-dependencies]
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "ext"
harness = false
