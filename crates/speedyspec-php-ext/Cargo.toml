[package]
name = "speedyspec-php-ext"
version = "0.2.1"
description = "The speedyspec_wordpress PHP extension's shared parts: PHP twins of Rust ports, their PHP adapters, value conversion and the boundary counter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "php", "extension", "wordpress", "ffi"]
categories = ["development-tools::ffi", "api-bindings"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
# docs.rs's ext-php-rs bindings have no embed symbols, so the docs are built without the `embed` feature.
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "container"
role = "platform"

[features]
default = ["embed"]
# The embedded PHP. Off only for docs.rs, which cannot build it (see speedyspec-php).
embed = ["speedyspec-php/embed"]

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.2.0" }
speedyspec-php = { path = "../speedyspec-php", version = "0.8.1", default-features = false }
speedyspec-php-port-macros = { path = "../speedyspec-php-port-macros", version = "0.2.0" }
inventory = "0.3"

[dev-dependencies]
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "ext"
harness = false
