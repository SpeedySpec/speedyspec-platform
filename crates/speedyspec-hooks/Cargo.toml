[package]
name = "speedyspec-hooks"
version = "0.2.0"
description = "Hook contract for speedyspec: the Hooks trait, the Value type and a backend conformance suite. No storage."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["speedyspec", "hooks", "events", "plugins", "contracts"]
categories = ["web-programming"]
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.speedyspec]
seam = "hooks"
role = "contracts"

[features]
# Exposes `conformance`, the suite every backend must pass.
conformance = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
