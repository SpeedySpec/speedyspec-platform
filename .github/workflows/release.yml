name: release

# release-please keeps one release pull request open on main, with a version, CHANGELOG.md and GitHub release per
# crate (tagged speedyspec-<crate>-v<version>); the cargo-workspace plugin bumps the requirements of a released
# crate's dependents too. Merging that pull request creates the tags and releases, and the publish job then publishes
# every listed crate whose new version crates.io lacks, in scripts/publish-crates.txt order.
#
# Pull requests never run this workflow: only pushes to main and a manual dispatch do, and the publish job runs only
# when release-please has just created releases, or when dispatched with a release tag on main's history. Only
# released versions publish: scripts/publish-pending.sh refuses a pending crate whose release tag isn't at the
# checked-out commit or behind it. The token comes from the crates-io environment, whose secret only main and the
# speedyspec-*-v* tags can deploy with.
#
# Recovery:
# - The publish stopped part-way (a rate limit outlasting the job, say): dispatch with any tag the release created,
#   for example speedyspec-hooks-v0.2.0. Versions already on crates.io are skipped.
# - release-please failed while creating the releases (47 at once can hit GitHub's API rate limits): re-run the failed
#   jobs of this run. release-please creates only the releases still missing, and publish runs when it succeeds. If
#   release-please succeeds but reports no new releases (they all exist by then), dispatch with any created tag.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag whose commit is published (for example speedyspec-hooks-v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # RELEASE_TOKEN (optional) is a fine-grained token for this repository with Contents and Pull requests set to
      # read and write. A release pull request opened with GITHUB_TOKEN doesn't trigger CI; one opened with
      # RELEASE_TOKEN does.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # On the push that merged a release pull request, or on a dispatch with a tag (release-please is skipped then).
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.release-please.result == 'success' &&
        needs.release-please.outputs.releases_created == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    # CARGO_REGISTRY_TOKEN is this environment's secret: limited to main and the speedyspec-*-v* tags.
    environment: crates-io
    # crates.io lets an account publish 5 new crates at once, then one every 10 minutes: the first release (35 new
    # crates) takes about 5 hours. If it runs out of time, dispatch again with the same tag.
    timeout-minutes: 350
    concurrency:
      group: crates-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^speedyspec-[a-z0-9-]+-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$TAG is not a release tag (speedyspec-<crate>-v<version>)" >&2
              exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release commit (the merged release pull request) on a push; the checked tag on a dispatch. With the
          # whole history and every tag: publish-pending.sh checks each crate's release tag against it.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Check the tag is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$TAG is not on main's history: nothing is published" >&2
              exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.99"
      - name: Check the list
        run: |
          cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/metadata.json"
          scripts/release-crates.sh check "$RUNNER_TEMP/metadata.json"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
              echo "::error::the CARGO_REGISTRY_TOKEN secret is not set: nothing is published" >&2
              exit 1
          fi
          scripts/publish-pending.sh "$RUNNER_TEMP/metadata.json"
