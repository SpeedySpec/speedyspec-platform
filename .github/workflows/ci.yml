name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt
      - run: cargo fmt --all --check

  # Every crate but the six whose builds or tests link the static PHP; the php job lints those.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo clippy --workspace --all-targets --locked
          --exclude speedyspec-php --exclude speedyspec-php-ext --exclude speedyspec-container-php
          --exclude speedyspec-compat --exclude speedyspec-wp-hooks-php --exclude speedyspec-php-port-macros
          -- -D warnings

  # Without the static PHP: every crate but the six that link it (the php job runs those).
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --workspace --locked --target ${{ matrix.target }}
          --exclude speedyspec-php --exclude speedyspec-php-ext --exclude speedyspec-container-php
          --exclude speedyspec-compat --exclude speedyspec-wp-hooks-php --exclude speedyspec-php-port-macros

  # The static PHP (scripts/build-php.sh) and the six crates whose builds or tests embed it.
  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            run: ""
            platform: ""
            php-build: .php-build
          - name: linux-x86_64
            os: ubuntu-latest
            run: scripts/linux-php.sh
            platform: linux/amd64
            php-build: .php-build-linux
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            run: scripts/linux-php.sh
            platform: linux/arm64
            php-build: .php-build-linux-arm64
    name: php (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Which container platform scripts/linux-php.sh runs (Linux rows only).
      SPEEDYSPEC_LINUX_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        if: matrix.run == ''
        with:
          toolchain: "1.99"
          components: clippy
      - name: Cache static PHP
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.php-build }}/spc
            ${{ matrix.php-build }}/buildroot
          key: php-${{ matrix.name }}-${{ hashFiles('crates/speedyspec-php/php-version', 'scripts/build-php.sh', 'scripts/lib/**') }}
      - name: Build static PHP
        env:
          # Runners are throwaway, so spc may install missing build tools.
          SPEEDYSPEC_ALLOW_HOST_INSTALL: "1"
          # spc looks up source releases through the GitHub API; the read-only token avoids rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: ${{ matrix.run }} scripts/build-php.sh
      # Every extension WordPress needs: a missing one fails here, by name.
      - name: Extensions
        run: ${{ matrix.run }} cargo test --locked -p speedyspec-php --test extensions
      - name: Clippy with php
        if: matrix.run == ''
        run: >-
          cargo clippy --all-targets --locked
          -p speedyspec-php -p speedyspec-php-ext -p speedyspec-container-php -p speedyspec-compat -p speedyspec-wp-hooks-php
          -p speedyspec-php-port-macros
          -- -D warnings
      - name: Test with php
        run: >-
          ${{ matrix.run }} cargo test --locked
          -p speedyspec-php -p speedyspec-php-ext -p speedyspec-container-php -p speedyspec-compat
          -p speedyspec-wp-hooks-php -p speedyspec-php-port-macros

  # The publish list matches the workspace, the platform is closed (nothing outside this repository and crates.io),
  # and each crate's package has the files and manifest fields it needs.
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Metadata
        run: cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/metadata.json"
      - name: Check the list
        run: scripts/release-crates.sh check "$RUNNER_TEMP/metadata.json"
      - name: Test the closure check
        run: bash scripts/tests/platform-closure.sh
      # With dependencies: a [patch] or [replace] shows only in the resolved graph.
      - name: Check the closure
        run: |
          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/metadata-full.json"
          scripts/platform-closure.sh check "$RUNNER_TEMP/metadata-full.json" "$GITHUB_WORKSPACE"
      - name: Check each package's files and manifest
        run: scripts/check-crate-packages.sh

  # Every crate packages and builds from its package. Verifying builds the PHP crates, so this runs in the
  # linux-x86_64 container on the static PHP the php job built (restored from its cache, or built again on a miss).
  package:
    runs-on: ubuntu-latest
    needs: php
    env:
      SPEEDYSPEC_LINUX_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Restore static PHP
        uses: actions/cache/restore@v6
        with:
          path: |
            .php-build-linux/spc
            .php-build-linux/buildroot
          key: php-linux-x86_64-${{ hashFiles('crates/speedyspec-php/php-version', 'scripts/build-php.sh', 'scripts/lib/**') }}
      - name: Build static PHP
        env:
          SPEEDYSPEC_ALLOW_HOST_INSTALL: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/linux-php.sh scripts/build-php.sh
      - name: Package and verify every crate
        run: scripts/linux-php.sh cargo package --workspace --locked

  # What docs.rs builds: every published crate's docs, with DOCS_RS set and no PHP installed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # With each crate's own [package.metadata.docs.rs] features: the PHP crates build without `embed` there.
      - name: Build each crate's docs as docs.rs does
        run: |
          cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/metadata.json"
          for c in $(grep -v -e '^#' -e '^$' scripts/publish-crates.txt); do
            flags="$(jq -r --arg n "$c" '.packages[] | select(.name == $n) | .metadata.docs.rs
              | [if ."no-default-features" then "--no-default-features" else empty end,
                 if ."all-features" then "--all-features" else empty end] | join(" ")' "$RUNNER_TEMP/metadata.json")"
            DOCS_RS=1 RUSTDOCFLAGS="--cfg docsrs -D rustdoc::broken_intra_doc_links" cargo doc --no-deps --locked $flags -p "$c" || exit 1
          done
